<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    
    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
    .pulse-circle { animation: pulse 4s ease-in-out infinite alternate; }
    .float-card { animation: float 6s ease-in-out infinite alternate; }
    .wave-path { animation: wave 8s linear infinite; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      100% { transform: scale(1.15); opacity: 0.7; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes wave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }

    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#title-grad);
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .code-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      fill: #64748b;
    }
    .badge-bg { fill: rgba(30, 41, 59, 0.7); stroke: rgba(148, 163, 184, 0.2); stroke-width: 1; }
    .badge-text { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Grid -->
  <g class="grid-line">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="140" fill="url(#glow-cyan)" class="pulse-circle" style="transform-origin: 150px 80px;"/>
  <circle cx="1050" cy="240" r="160" fill="url(#glow-purple)" class="pulse-circle" style="transform-origin: 1050px 240px; animation-delay: -2s;"/>

  <!-- Animated Floating Decorative Elements (Strictly Background/Sides) -->
  <!-- Left Side Floating Card -->
  <g class="float-card" style="transform-origin: 80px 180px;">
    <rect x="50" y="140" width="160" height="110" rx="10" fill="rgba(15, 23, 42, 0.65)" stroke="#38bdf8" stroke-width="1" filter="url(#shadow)"/>
    <circle cx="70" cy="160" r="4" fill="#ef4444"/>
    <circle cx="82" cy="160" r="4" fill="#eab308"/>
    <circle cx="94" cy="160" r="4" fill="#22c55e"/>
    <text x="65" y="190" class="code-text">&lt;IDE_Core&gt;</text>
    <text x="75" y="210" class="code-text">status: ok</text>
    <text x="75" y="230" class="code-text">build: 2026</text>
  </g>

  <!-- Right Side Floating Code Card -->
  <g class="float-card" style="animation-delay: -3s; transform-origin: 1050px 100px;">
    <rect x="970" y="50" width="180" height="120" rx="10" fill="rgba(15, 23, 42, 0.65)" stroke="#a855f7" stroke-width="1" filter="url(#shadow)"/>
    <circle cx="990" cy="70" r="4" fill="#ef4444"/>
    <circle cx="1002" cy="70" r="4" fill="#eab308"/>
    <circle cx="1014" cy="70" r="4" fill="#22c55e"/>
    <text x="985" y="100" class="code-text">import { IDE }</text>
    <text x="985" y="120" class="code-text">const app = new IDE()</text>
    <text x="985" y="140" class="code-text">app.optimize()</text>
  </g>

  <!-- Foreground Main Title and Subtitle Block (Guaranteed Unobscured Center Zone) -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Main Title -->
    <text x="600" y="130" class="title-text">Awesome Integrated Development Environments</text>
    
    <!-- Subtitle -->
    <text x="600" y="175" class="subtitle-text">Curated Ecosystem of SaaS Developer Suites & Open-Source Code Editors</text>
    
    <!-- Tech Tag Pills -->
    <g transform="translate(360, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="32" rx="16" class="badge-bg"/>
      <text x="65" y="20" text-anchor="middle" class="badge-text">⚡ SaaS Suites</text>
      
      <!-- Pill 2 -->
      <rect x="150" y="0" width="170" height="32" rx="16" class="badge-bg"/>
      <text x="235" y="20" text-anchor="middle" class="badge-text">🚀 Open-Source IDEs</text>
      
      <!-- Pill 3 -->
      <rect x="340" y="0" width="140" height="32" rx="16" class="badge-bg"/>
      <text x="410" y="20" text-anchor="middle" class="badge-text">🛠️ Developer Tools</text>
    </g>
  </g>
</svg>
